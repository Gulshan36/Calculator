<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0ea5e9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0369a1;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="90" fill="url(#grad)"/>
  
  <!-- Calculator Display -->
  <rect x="50" y="40" width="100" height="30" rx="5" fill="white" opacity="0.9"/>
  
  <!-- Calculator Buttons -->
  <g fill="white" opacity="0.9">
    <rect x="55" y="80" width="20" height="20" rx="3"/>
    <rect x="80" y="80" width="20" height="20" rx="3"/>
    <rect x="105" y="80" width="20" height="20" rx="3"/>
    <rect x="130" y="80" width="20" height="20" rx="3"/>
    
    <rect x="55" y="105" width="20" height="20" rx="3"/>
    <rect x="80" y="105" width="20" height="20" rx="3"/>
    <rect x="105" y="105" width="20" height="20" rx="3"/>
    <rect x="130" y="105" width="20" height="20" rx="3"/>
    
    <rect x="55" y="130" width="20" height="20" rx="3"/>
    <rect x="80" y="130" width="20" height="20" rx="3"/>
    <rect x="105" y="130" width="20" height="20" rx="3"/>
    <rect x="130" y="130" width="45" height="20" rx="3"/>
  </g>
  
  <!-- Symbols on buttons -->
  <g fill="#0369a1" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">
    <text x="65" y="93">7</text>
    <text x="90" y="93">8</text>
    <text x="115" y="93">9</text>
    <text x="140" y="93">÷</text>
    
    <text x="65" y="118">4</text>
    <text x="90" y="118">5</text>
    <text x="115" y="118">6</text>
    <text x="140" y="118">×</text>
    
    <text x="65" y="143">1</text>
    <text x="90" y="143">2</text>
    <text x="115" y="143">3</text>
    <text x="152.5" y="143">=</text>
  </g>
</svg>
